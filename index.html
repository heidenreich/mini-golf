<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini Golf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="theme-tiny">
<div id="wrap">
  <div id="hud">
    <button id="menu-btn" class="chip icon" aria-label="Menu">&#9776;</button>
    <button id="restart-btn" class="chip icon" aria-label="Restart hole">&#8635;</button>
    <span class="chip">Hole <b id="hud-hole">1</b>/<span id="hud-holes">4</span></span>
    <span class="chip" id="hud-name"></span>
    <span class="chip">Par <b id="hud-par">2</b></span>
    <span class="chip">Strokes <b id="hud-strokes">0</b></span>
    <span class="chip">Total <b id="hud-total">0</b></span>
  </div>
  <canvas id="game"></canvas>
  <div id="hint">
    <span class="hint-mouse">Drag back from anywhere and release to putt &middot; Esc for the menu &middot; R restarts the hole</span>
    <span class="hint-touch">Drag back and release to putt &middot; &#9776; menu &middot; &#8635; restart</span>
  </div>
</div>
<div id="toast"></div>
<div id="overlay"><div class="card" id="card"></div></div>

<script src="js/draw.js"></script>
<script src="js/courses.js"></script>
<script src="js/physics.js"></script>
<script src="js/theme-tiny.js"></script>
<script src="js/theme-desk.js"></script>
<script src="js/main.js"></script>
</body>
</html>
