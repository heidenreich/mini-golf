<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini Golf</title>
<style>
  :root {
    --bg: #14301f;
    --panel: rgba(10, 25, 16, 0.9);
    --text: #f3f7f2;
    --muted: #a9c2b0;
    --accent: #ffd34d;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
  }
  #wrap {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 12px 16px;
  }
  #hud {
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
    justify-content: center;
    font-variant-numeric: tabular-nums;
  }
  #hud b { color: var(--accent); font-weight: 600; }
  canvas {
    display: block;
    touch-action: none;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    cursor: crosshair;
  }
  #hint { color: var(--muted); font-size: 13px; text-align: center; }
  #toast {
    position: fixed;
    top: 18%;
    left: 50%;
    transform: translateX(-50%);
    background: var(--panel);
    padding: 8px 16px;
    border-radius: 999px;
    font-weight: 600;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    white-space: nowrap;
  }
  #toast.show { opacity: 1; }
  #overlay {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.35);
    padding: 16px;
  }
  #overlay.show { display: flex; }
  .card {
    background: var(--panel);
    padding: 22px 26px;
    border-radius: 14px;
    text-align: center;
    min-width: 260px;
    max-width: 100%;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
  }
  .card h2 { margin: 0 0 6px; font-size: 26px; color: var(--accent); }
  .card p { margin: 0 0 16px; color: var(--muted); }
  .card table {
    border-collapse: collapse;
    margin: 0 auto 16px;
    font-variant-numeric: tabular-nums;
  }
  .card th, .card td {
    padding: 4px 10px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.12);
  }
  .card tfoot td { font-weight: 700; border-bottom: 0; }
  button {
    font: inherit;
    font-weight: 600;
    background: var(--accent);
    color: #1b2a10;
    border: 0;
    border-radius: 8px;
    padding: 9px 18px;
    cursor: pointer;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <span>Hole <b id="hud-hole">1</b>/<span id="hud-holes">3</span></span>
    <span id="hud-name"></span>
    <span>Par <b id="hud-par">2</b></span>
    <span>Strokes <b id="hud-strokes">0</b></span>
    <span>Total <b id="hud-total">0</b></span>
  </div>
  <canvas id="game"></canvas>
  <div id="hint">Drag back from anywhere and release to putt &middot; Esc cancels &middot; R restarts the hole</div>
</div>
<div id="toast"></div>
<div id="overlay"><div class="card" id="card"></div></div>

<script>
'use strict';

// ---- Tuning ---------------------------------------------------------------

const W = 900, H = 600;          // world size; the canvas scales to fit
const BALL_R = 7;
const CUP_R = 12;
const WALL_HALF = 4;             // walls are drawn 8px thick
const MAX_SPEED = 1300;          // px/s at full power
const MAX_DRAG = 160;            // drag distance (world px) for full power
const CUP_CAPTURE_SPEED = 400;   // faster than this and the ball lips out
const RESTITUTION = 0.72;        // bounciness of walls
const STEP = 1 / 120;            // fixed physics timestep
const MAX_STROKES = 8;           // pick up after this many

// k = proportional drag, decel = constant rolling resistance (px/s²)
const SURFACES = {
  grass: { k: 1.1, decel: 40 },
  sand:  { k: 4.5, decel: 220 },
  ice:   { k: 0.25, decel: 8 },
};

// ---- Course ---------------------------------------------------------------
// shape: the outline of the fairway; its edges become the boundary walls.
// zones: rectangles of sand / ice / water / slope (ax, ay = push in px/s²).
// spinners: rotating bars (len = half-length, speed = rad/s).

const HOLES = [
  {
    name: 'Dogleg',
    par: 2,
    shape: [[100, 180], [180, 100], [820, 100], [820, 280], [300, 280], [300, 520], [100, 520]],
    start: [200, 450],
    cup: [740, 190],
    zones: [],
    walls: [],
    spinners: [],
  },
  {
    name: 'Sand Trap',
    par: 3,
    shape: [[80, 120], [820, 120], [820, 480], [80, 480]],
    start: [160, 200],
    cup: [740, 200],
    zones: [
      { type: 'water', x: 400, y: 120, w: 110, h: 240 },
      { type: 'sand', x: 400, y: 420, w: 110, h: 60 },
      { type: 'sand', x: 610, y: 250, w: 120, h: 110 },
    ],
    walls: [],
    spinners: [],
  },
  {
    name: 'Windmill',
    par: 3,
    shape: [[80, 200], [820, 200], [820, 400], [80, 400]],
    start: [130, 300],
    cup: [765, 300],
    zones: [
      { type: 'ice', x: 190, y: 200, w: 150, h: 200 },
      { type: 'slope', x: 590, y: 200, w: 110, h: 200, ax: 0, ay: 220 },
    ],
    walls: [],
    spinners: [{ x: 450, y: 300, len: 76, speed: 1.4 }],
  },
];

// ---- State ----------------------------------------------------------------

const game = {
  holeIndex: 0,
  scores: [],
  strokes: 0,
  ball: { x: 0, y: 0, vx: 0, vy: 0 },
  lastRest: { x: 0, y: 0 },
  state: 'aim',                  // aim | rolling | sinking | done
  t: 0,
  stillTime: 0,
  sinkT: 0,
  sinkFrom: null,
  drag: null,
};

const hole = () => HOLES[game.holeIndex];

function startHole(index) {
  game.holeIndex = index;
  game.strokes = 0;
  const [x, y] = hole().start;
  Object.assign(game.ball, { x, y, vx: 0, vy: 0 });
  game.lastRest = { x, y };
  game.state = 'aim';
  game.stillTime = 0;
  game.drag = null;
  hideOverlay();
  updateHud();
  toast(`Hole ${index + 1} · ${hole().name} · Par ${hole().par}`);
}

function boundaryWalls(h) {
  const segs = [];
  for (let i = 0; i < h.shape.length; i++) {
    const [x1, y1] = h.shape[i];
    const [x2, y2] = h.shape[(i + 1) % h.shape.length];
    segs.push({ x1, y1, x2, y2 });
  }
  for (const [x1, y1, x2, y2] of h.walls) segs.push({ x1, y1, x2, y2 });
  return segs;
}

function spinnerSegments(h, t) {
  return h.spinners.map(s => {
    const a = t * s.speed;
    const dx = Math.cos(a) * s.len, dy = Math.sin(a) * s.len;
    return { x1: s.x - dx, y1: s.y - dy, x2: s.x + dx, y2: s.y + dy, spin: s.speed, cx: s.x, cy: s.y };
  });
}

function zoneAt(x, y) {
  const zones = hole().zones;
  for (let i = zones.length - 1; i >= 0; i--) {
    const z = zones[i];
    if (x >= z.x && x <= z.x + z.w && y >= z.y && y <= z.y + z.h) return z;
  }
  return null;
}

// ---- Physics --------------------------------------------------------------

// Pushes the ball out of any segment it overlaps and reflects its velocity
// relative to the wall (so spinning bars can knock the ball). Returns the
// hardest impact speed, for sound.
function collide(b, segs) {
  const R = BALL_R + WALL_HALF;
  let impact = 0;
  for (const s of segs) {
    const ex = s.x2 - s.x1, ey = s.y2 - s.y1;
    const len2 = ex * ex + ey * ey;
    let t = len2 ? ((b.x - s.x1) * ex + (b.y - s.y1) * ey) / len2 : 0;
    t = Math.max(0, Math.min(1, t));
    const cx = s.x1 + ex * t, cy = s.y1 + ey * t;
    const dx = b.x - cx, dy = b.y - cy;
    const d2 = dx * dx + dy * dy;
    if (d2 >= R * R) continue;

    let nx, ny;
    if (d2 > 1e-9) {
      const d = Math.sqrt(d2);
      nx = dx / d; ny = dy / d;
    } else {
      const l = Math.sqrt(len2) || 1;
      nx = -ey / l; ny = ex / l;
    }
    b.x = cx + nx * R;
    b.y = cy + ny * R;

    let wvx = 0, wvy = 0;
    if (s.spin) {
      wvx = -s.spin * (cy - s.cy);
      wvy = s.spin * (cx - s.cx);
    }
    const rvx = b.vx - wvx, rvy = b.vy - wvy;
    const vn = rvx * nx + rvy * ny;
    if (vn < 0) {
      const tvx = rvx - vn * nx, tvy = rvy - vn * ny;
      b.vx = wvx + tvx * 0.95 - vn * RESTITUTION * nx;
      b.vy = wvy + tvy * 0.95 - vn * RESTITUTION * ny;
      impact = Math.max(impact, -vn);
    }
  }
  return impact;
}

function step(dt) {
  game.t += dt;
  const b = game.ball;
  const h = hole();

  if (game.state === 'sinking') {
    game.sinkT = Math.min(1, game.sinkT + dt / 0.3);
    b.x = game.sinkFrom.x + (h.cup[0] - game.sinkFrom.x) * game.sinkT;
    b.y = game.sinkFrom.y + (h.cup[1] - game.sinkFrom.y) * game.sinkT;
    if (game.sinkT >= 1) finishHole(false);
    return;
  }
  if (game.state === 'done') return;

  // Surface forces
  const zone = zoneAt(b.x, b.y);
  const surface = SURFACES[zone && SURFACES[zone.type] ? zone.type : 'grass'];
  if (zone && zone.type === 'slope') {
    b.vx += zone.ax * dt;
    b.vy += zone.ay * dt;
  }
  let speed = Math.hypot(b.vx, b.vy);
  if (speed > 0) {
    const ns = Math.max(0, speed * Math.exp(-surface.k * dt) - surface.decel * dt);
    b.vx *= ns / speed;
    b.vy *= ns / speed;
    speed = ns;
  }

  // Move in sub-steps of at most half a ball radius so fast shots can't
  // tunnel through walls.
  const segs = boundaryWalls(h).concat(spinnerSegments(h, game.t));
  const n = Math.max(1, Math.ceil((speed * dt) / (BALL_R * 0.5)));
  let impact = 0;
  for (let i = 0; i < n; i++) {
    b.x += (b.vx * dt) / n;
    b.y += (b.vy * dt) / n;
    impact = Math.max(impact, collide(b, segs), collide(b, segs));
    if (game.state === 'rolling' && checkCup(dt / n)) return;
  }
  if (impact > 60) sfx.wall(impact);
  speed = Math.hypot(b.vx, b.vy);

  if (game.state === 'aim') {
    // At rest. Only a spinner knock gets it moving again.
    if (speed > 30) {
      game.state = 'rolling';
      game.drag = null;
    } else {
      b.vx = b.vy = 0;
    }
    return;
  }

  const after = zoneAt(b.x, b.y);
  if (after && after.type === 'water') {
    sfx.splash();
    game.strokes++;
    Object.assign(b, { x: game.lastRest.x, y: game.lastRest.y, vx: 0, vy: 0 });
    game.state = 'aim';
    updateHud();
    toast('Water hazard · +1 stroke');
    if (game.strokes >= MAX_STROKES) finishHole(true);
    return;
  }

  if (speed < 10) {
    game.stillTime += dt;
    if (game.stillTime > 0.25) {
      b.vx = b.vy = 0;
      game.state = 'aim';
      game.lastRest = { x: b.x, y: b.y };
      if (game.strokes >= MAX_STROKES) finishHole(true);
    }
  } else {
    game.stillTime = 0;
  }
}

function checkCup(dt) {
  const b = game.ball;
  const [cx, cy] = hole().cup;
  const dx = cx - b.x, dy = cy - b.y;
  const d = Math.hypot(dx, dy);
  if (d >= CUP_R) return false;
  const speed = Math.hypot(b.vx, b.vy);
  if (speed < CUP_CAPTURE_SPEED) {
    game.state = 'sinking';
    game.sinkT = 0;
    game.sinkFrom = { x: b.x, y: b.y };
    b.vx = b.vy = 0;
    sfx.cup();
    return true;
  }
  // Too fast: the lip curls the ball a little but it rolls on.
  if (d > 0.001) {
    b.vx += (dx / d) * 1800 * dt;
    b.vy += (dy / d) * 1800 * dt;
  }
  return false;
}

function shoot(dirX, dirY, power) {
  if (game.state !== 'aim') return;
  const len = Math.hypot(dirX, dirY) || 1;
  const p = Math.max(0, Math.min(1, power));
  game.ball.vx = (dirX / len) * p * MAX_SPEED;
  game.ball.vy = (dirY / len) * p * MAX_SPEED;
  game.lastRest = { x: game.ball.x, y: game.ball.y };
  game.strokes++;
  game.state = 'rolling';
  game.stillTime = 0;
  sfx.hit(p);
  updateHud();
}

// ---- Scoring & UI ---------------------------------------------------------

function scoreName(strokes, par) {
  if (strokes === 1) return 'Hole in one!';
  const diff = strokes - par;
  const names = { '-3': 'Albatross!', '-2': 'Eagle!', '-1': 'Birdie!', '0': 'Par', '1': 'Bogey', '2': 'Double bogey' };
  return names[diff] || (diff > 0 ? `+${diff}` : `${diff}`);
}

const total = () => game.scores.reduce((a, s) => a + s, 0);

function finishHole(pickedUp) {
  game.state = 'done';
  game.drag = null;
  game.scores[game.holeIndex] = game.strokes;
  updateHud();
  const last = game.holeIndex === HOLES.length - 1;
  const title = pickedUp ? 'Picked up' : scoreName(game.strokes, hole().par);
  const strokeWord = game.strokes === 1 ? 'stroke' : 'strokes';
  showOverlay(
    `<h2>${title}</h2>` +
    `<p>${game.strokes} ${strokeWord} on a par ${hole().par}</p>` +
    `<button id="next">${last ? 'See scorecard' : 'Next hole'}</button>`,
    () => (last ? showScorecard() : startHole(game.holeIndex + 1))
  );
}

function showScorecard() {
  const par = HOLES.reduce((a, h) => a + h.par, 0);
  const rows = HOLES.map((h, i) =>
    `<tr><td>${i + 1}</td><td>${h.name}</td><td>${h.par}</td><td>${game.scores[i]}</td></tr>`
  ).join('');
  const diff = total() - par;
  const vsPar = diff === 0 ? 'Even par' : diff > 0 ? `${diff} over par` : `${-diff} under par`;
  showOverlay(
    `<h2>Round complete</h2><p>${vsPar}</p>` +
    `<table><thead><tr><th>#</th><th>Hole</th><th>Par</th><th>Score</th></tr></thead>` +
    `<tbody>${rows}</tbody>` +
    `<tfoot><tr><td></td><td>Total</td><td>${par}</td><td>${total()}</td></tr></tfoot></table>` +
    `<button id="next">Play again</button>`,
    () => { game.scores = []; startHole(0); }
  );
}

const $ = id => document.getElementById(id);
let overlayAction = null;

function showOverlay(html, action) {
  $('card').innerHTML = html;
  overlayAction = action;
  $('overlay').classList.add('show');
  $('next').addEventListener('click', () => overlayAction && overlayAction());
  $('next').focus();
}

function hideOverlay() {
  $('overlay').classList.remove('show');
  overlayAction = null;
}

function updateHud() {
  $('hud-hole').textContent = game.holeIndex + 1;
  $('hud-holes').textContent = HOLES.length;
  $('hud-name').textContent = hole().name;
  $('hud-par').textContent = hole().par;
  $('hud-strokes').textContent = game.strokes;
  $('hud-total').textContent = total() + (game.state === 'done' ? 0 : game.strokes);
}

let toastTimer;
function toast(msg) {
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
}

// ---- Sound ----------------------------------------------------------------

let audio = null;
let lastWallSound = 0;

function ensureAudio() {
  if (!audio) {
    try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  }
  if (audio.state === 'suspended') audio.resume();
}

function tone(freq, dur, type, vol, delay = 0) {
  if (!audio) return;
  const t = audio.currentTime + delay;
  const osc = audio.createOscillator();
  const gain = audio.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t);
  gain.gain.setValueAtTime(vol, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
  osc.connect(gain).connect(audio.destination);
  osc.start(t);
  osc.stop(t + dur);
}

const sfx = {
  hit: p => tone(160 + p * 120, 0.09, 'triangle', 0.3),
  wall: impact => {
    if (game.t - lastWallSound < 0.05) return;
    lastWallSound = game.t;
    tone(300, 0.05, 'square', 0.06 * Math.min(1, impact / 500));
  },
  cup: () => { tone(660, 0.12, 'sine', 0.2); tone(990, 0.25, 'sine', 0.2, 0.1); },
  splash: () => { tone(140, 0.35, 'sawtooth', 0.08); tone(90, 0.4, 'sine', 0.15); },
};

// ---- Input ----------------------------------------------------------------

const canvas = $('game');
const ctx = canvas.getContext('2d');
let scale = 1;

function toWorld(e) {
  const r = canvas.getBoundingClientRect();
  return { x: ((e.clientX - r.left) / r.width) * W, y: ((e.clientY - r.top) / r.height) * H };
}

function dragShot() {
  const d = game.drag;
  const dx = d.sx - d.x, dy = d.sy - d.y;
  const len = Math.hypot(dx, dy);
  return { dx, dy, power: Math.min(len, MAX_DRAG) / MAX_DRAG };
}

canvas.addEventListener('pointerdown', e => {
  ensureAudio();
  if (game.state !== 'aim') return;
  canvas.setPointerCapture(e.pointerId);
  const p = toWorld(e);
  game.drag = { sx: p.x, sy: p.y, x: p.x, y: p.y };
});

canvas.addEventListener('pointermove', e => {
  if (!game.drag) return;
  const p = toWorld(e);
  game.drag.x = p.x;
  game.drag.y = p.y;
});

canvas.addEventListener('pointerup', () => {
  if (!game.drag) return;
  const { dx, dy, power } = dragShot();
  game.drag = null;
  if (power > 0.04) shoot(dx, dy, power);
});

canvas.addEventListener('pointercancel', () => { game.drag = null; });

window.addEventListener('keydown', e => {
  if (e.key === 'Escape') game.drag = null;
  if ((e.key === 'r' || e.key === 'R') && game.state !== 'done') startHole(game.holeIndex);
});

// ---- Rendering ------------------------------------------------------------

function resize() {
  const hud = $('hud').offsetHeight + $('hint').offsetHeight + 44;
  scale = Math.max(0.2, Math.min((innerWidth - 32) / W, (innerHeight - hud) / H));
  const dpr = window.devicePixelRatio || 1;
  canvas.style.width = `${W * scale}px`;
  canvas.style.height = `${H * scale}px`;
  canvas.width = Math.round(W * scale * dpr);
  canvas.height = Math.round(H * scale * dpr);
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
}
window.addEventListener('resize', resize);

function tracePolygon(pts) {
  ctx.beginPath();
  pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
  ctx.closePath();
}

function drawZone(z) {
  ctx.save();
  ctx.beginPath();
  ctx.rect(z.x, z.y, z.w, z.h);
  ctx.clip();
  if (z.type === 'sand') {
    ctx.fillStyle = '#e8d49a';
    ctx.fillRect(z.x, z.y, z.w, z.h);
    ctx.fillStyle = 'rgba(150, 120, 60, 0.35)';
    for (let i = 0; i < (z.w * z.h) / 120; i++) {
      const px = z.x + ((i * 73.13) % z.w);
      const py = z.y + ((i * 41.71) % z.h);
      ctx.fillRect(px, py, 1.5, 1.5);
    }
  } else if (z.type === 'water') {
    ctx.fillStyle = '#2f86cf';
    ctx.fillRect(z.x, z.y, z.w, z.h);
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
    ctx.lineWidth = 2;
    for (let y = z.y + 12; y < z.y + z.h; y += 18) {
      ctx.beginPath();
      for (let x = z.x; x <= z.x + z.w; x += 6) {
        const wy = y + Math.sin(x * 0.08 + game.t * 2 + y) * 3;
        x === z.x ? ctx.moveTo(x, wy) : ctx.lineTo(x, wy);
      }
      ctx.stroke();
    }
  } else if (z.type === 'ice') {
    ctx.fillStyle = '#cdeefa';
    ctx.fillRect(z.x, z.y, z.w, z.h);
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
    ctx.lineWidth = 2;
    for (let i = -z.h; i < z.w; i += 34) {
      ctx.beginPath();
      ctx.moveTo(z.x + i, z.y + z.h);
      ctx.lineTo(z.x + i + z.h * 0.6, z.y);
      ctx.stroke();
    }
  } else if (z.type === 'slope') {
    ctx.fillStyle = 'rgba(30, 90, 40, 0.35)';
    ctx.fillRect(z.x, z.y, z.w, z.h);
    const a = Math.atan2(z.ay, z.ax);
    const gap = 40;
    const offset = (game.t * 25) % gap;
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    const cx = z.x + z.w / 2, cy = z.y + z.h / 2;
    const reach = Math.hypot(z.w, z.h) / 2 + gap;
    for (let d = -reach + offset; d < reach; d += gap) {
      for (let s = -reach; s < reach; s += 36) {
        const px = cx + Math.cos(a) * d - Math.sin(a) * s;
        const py = cy + Math.sin(a) * d + Math.cos(a) * s;
        ctx.save();
        ctx.translate(px, py);
        ctx.rotate(a);
        ctx.beginPath();
        ctx.moveTo(-6, -8);
        ctx.lineTo(4, 0);
        ctx.lineTo(-6, 8);
        ctx.stroke();
        ctx.restore();
      }
    }
  }
  ctx.restore();
}

function render() {
  const h = hole();
  const b = game.ball;

  // Rough
  ctx.fillStyle = '#2e6a3b';
  ctx.fillRect(0, 0, W, H);

  // Fairway with mowing stripes
  ctx.save();
  tracePolygon(h.shape);
  ctx.fillStyle = '#5cbf57';
  ctx.fill();
  ctx.clip();
  ctx.fillStyle = 'rgba(255, 255, 255, 0.06)';
  for (let x = 0; x < W; x += 80) ctx.fillRect(x, 0, 40, H);
  ctx.restore();

  h.zones.forEach(drawZone);

  // Tee and cup
  const [sx, sy] = h.start;
  ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
  ctx.fillRect(sx - 14, sy - 2, 28, 4);
  const [cx, cy] = h.cup;
  ctx.beginPath();
  ctx.arc(cx, cy, CUP_R + 2, 0, Math.PI * 2);
  ctx.fillStyle = '#d9f2d0';
  ctx.fill();
  ctx.beginPath();
  ctx.arc(cx, cy, CUP_R, 0, Math.PI * 2);
  ctx.fillStyle = '#10180f';
  ctx.fill();

  // Walls
  const walls = boundaryWalls(h);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.save();
  tracePolygon(h.shape);
  ctx.strokeStyle = '#7a4a24';
  ctx.lineWidth = WALL_HALF * 2;
  ctx.stroke();
  ctx.strokeStyle = '#b07a44';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.restore();
  for (const s of walls.slice(h.shape.length)) {
    ctx.beginPath();
    ctx.moveTo(s.x1, s.y1);
    ctx.lineTo(s.x2, s.y2);
    ctx.strokeStyle = '#7a4a24';
    ctx.lineWidth = WALL_HALF * 2;
    ctx.stroke();
  }

  // Spinners
  for (const s of spinnerSegments(h, game.t)) {
    ctx.beginPath();
    ctx.moveTo(s.x1, s.y1);
    ctx.lineTo(s.x2, s.y2);
    ctx.strokeStyle = '#c0392b';
    ctx.lineWidth = WALL_HALF * 2;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(s.cx, s.cy, 9, 0, Math.PI * 2);
    ctx.fillStyle = '#f1f1f1';
    ctx.fill();
  }

  // Ball
  let r = BALL_R;
  if (game.state === 'sinking') r *= 1 - 0.6 * game.sinkT;
  if (game.state !== 'done') {
    ctx.beginPath();
    ctx.arc(b.x + 2, b.y + 3, r, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(b.x, b.y, r, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff';
    ctx.fill();
    ctx.strokeStyle = 'rgba(0, 0, 0, 0.2)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // Flag (pulled when the ball gets close)
  const flagAlpha = Math.max(0, Math.min(1, (Math.hypot(b.x - cx, b.y - cy) - 40) / 60));
  if (flagAlpha > 0) {
    ctx.save();
    ctx.globalAlpha = flagAlpha;
    ctx.strokeStyle = '#eeeeee';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx, cy - 48);
    ctx.stroke();
    ctx.fillStyle = '#e74c3c';
    ctx.beginPath();
    ctx.moveTo(cx, cy - 48);
    ctx.lineTo(cx + 24, cy - 41);
    ctx.lineTo(cx, cy - 34);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  // Aim guide
  if (game.drag && game.state === 'aim') {
    const { dx, dy, power } = dragShot();
    const len = Math.hypot(dx, dy) || 1;
    const ux = dx / len, uy = dy / len;
    const reach = 30 + power * 140;
    const hue = 120 - power * 120;   // green -> red
    ctx.strokeStyle = `hsl(${hue}, 85%, 55%)`;
    ctx.fillStyle = ctx.strokeStyle;
    ctx.lineWidth = 3;
    ctx.setLineDash([8, 7]);
    ctx.beginPath();
    ctx.moveTo(b.x + ux * (BALL_R + 4), b.y + uy * (BALL_R + 4));
    ctx.lineTo(b.x + ux * reach, b.y + uy * reach);
    ctx.stroke();
    ctx.setLineDash([]);
    const tx = b.x + ux * reach, ty = b.y + uy * reach;
    ctx.beginPath();
    ctx.moveTo(tx + ux * 10, ty + uy * 10);
    ctx.lineTo(tx - uy * 7, ty + ux * 7);
    ctx.lineTo(tx + uy * 7, ty - ux * 7);
    ctx.closePath();
    ctx.fill();

    // Power meter
    ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
    ctx.fillRect(W - 150, H - 30, 130, 12);
    ctx.fillStyle = `hsl(${hue}, 85%, 55%)`;
    ctx.fillRect(W - 150, H - 30, 130 * power, 12);
  }
}

// ---- Main loop ------------------------------------------------------------

let last = performance.now();
let acc = 0;
function frame(now) {
  acc += Math.min(0.1, (now - last) / 1000);
  last = now;
  while (acc >= STEP) {
    step(STEP);
    acc -= STEP;
  }
  render();
  requestAnimationFrame(frame);
}

resize();
startHole(0);
requestAnimationFrame(frame);

// Handy for debugging from the console and for automated tests.
window.miniGolf = { game, HOLES, shoot, step, startHole };
</script>
</body>
</html>
